<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frequency</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#121212">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Dark Theme Defaults */
      --bg: #121212;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --border-color: rgba(255, 255, 255, 0.08);
      --modal-bg: #1e1e1e;
      --accent: #10b981;
      --card-surface: #1b1b1d;
      --logo-plate-neutral: rgba(255, 255, 255, 0.08);
      --logo-plate-border: rgba(255, 255, 255, 0.15);
      
      /* Dynamic Player Bar Variables */
      --pb-bg: rgba(24, 24, 24, 0.95);
      --pb-text: #ffffff;
    }

    /* Light Theme Overrides */
    [data-theme="light"] {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --text-muted: #86868b;
      --border-color: rgba(0, 0, 0, 0.1);
      --modal-bg: #ffffff;
      --card-surface: #ffffff;
      --logo-plate-neutral: rgba(0, 0, 0, 0.06);
      --logo-plate-border: rgba(0, 0, 0, 0.12);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 2rem 120px 2rem; 
      user-select: none;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Top Bar & Theme Toggle */
    .top-bar {
      width: 100%;
      max-width: 850px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .app-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .theme-toggle {
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.2s;
    }
    .theme-toggle:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .toolbar {
      width: 100%;
      max-width: 850px;
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .search-input {
      flex: 1;
      border: 1px solid var(--border-color);
      background: var(--modal-bg);
      color: var(--text);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
    }
    .toolbar-btn {
      border: 1px solid var(--border-color);
      background: var(--modal-bg);
      color: var(--text);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      cursor: pointer;
    }
    .toolbar-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: transparent;
    }

    .recent-wrap {
      width: 100%;
      max-width: 850px;
      margin-bottom: 1rem;
      display: none;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .recent-wrap.active { display: flex; }
    .recent-chip {
      border: 1px solid var(--border-color);
      background: var(--modal-bg);
      color: var(--text);
      border-radius: 999px;
      padding: 0.45rem 0.7rem;
      font-size: 0.75rem;
      cursor: pointer;
      max-width: 180px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 850px;
      align-content: start;
    }

    @keyframes fadeUpBounce {
      0% { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Colored Station Cards */
    .card {
      border-radius: 16px;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid var(--border-color); 
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      animation: fadeUpBounce 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      background: var(--card-surface);
      color: var(--text);
      --card-logo-plate-bg: var(--logo-plate-neutral);
      --card-logo-plate-border: var(--logo-plate-border);
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-6px) scale(1.03);
      outline: none;
    }

    .card.playing {
      transform: scale(1.05);
      z-index: 2;
    }

    /* Add Custom Station Button */
    .card.add-btn {
      background: transparent !important;
      border: 2px dashed var(--border-color);
      color: var(--text-muted);
    }
    .card.add-btn:hover { border-color: var(--text); color: var(--text); }
    .card.add-btn i { font-size: 2rem; margin-bottom: 0.8rem; }

    .card .logo-plate {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.8rem;
      background: var(--card-logo-plate-bg);
      border: 1px solid var(--card-logo-plate-border);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    /* Seamless Logos */
    .card img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 0;
      box-shadow: none;
      filter: none;
      background: transparent;
    }

    .card .name { 
      font-size: 0.85rem; 
      font-weight: 600; 
      text-align: center; 
      letter-spacing: 0.5px;
    }

    .favorite-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s, transform 0.2s;
    }
    .favorite-btn:hover { opacity: 1; transform: scale(1.1); }
    .favorite-btn.active { opacity: 1; color: #ff4b2b; }

    /* Edit Button for Custom Stations */
    .edit-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s, transform 0.2s;
    }
    .edit-btn:hover { opacity: 1; transform: scale(1.1); }

    .mode-btn {
      position: absolute;
      left: 10px;
      bottom: 10px;
      border: 1px solid currentColor;
      background: rgba(0,0,0,0.08);
      color: inherit;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      cursor: pointer;
      padding: 0;
    }
    .mode-btn:hover { opacity: 1; }

    /* Dynamic Player Bar */
    .player-bar {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background-color: var(--pb-bg);
      color: var(--pb-text);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 1.2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      box-sizing: border-box;
      transform: translateY(100%);
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.4s ease, color 0.4s ease;
      z-index: 100;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
    }
    
    .player-bar.active { transform: translateY(0); }

    .now-playing { display: flex; align-items: center; gap: 1rem; width: 30%; }
    .now-playing img { 
      width: 40px; 
      height: 40px; 
      border-radius: 0; 
      object-fit: contain;
    }
    .now-playing .title { font-weight: 700; font-size: 1rem; margin-bottom: 4px;}
    .now-playing .status { font-size: 0.75rem; opacity: 0.8; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;}

    .controls { display: flex; align-items: center; justify-content: center; width: 40%; gap: 1.5rem; }
    
    .play-btn {
      background: var(--pb-text);
      color: var(--pb-bg);
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s, background-color 0.4s ease, color 0.4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .play-btn:hover { transform: scale(1.08); }
    .play-btn:active { transform: scale(0.95); }

    .tools { display: flex; align-items: center; justify-content: flex-end; width: 30%; gap: 1.5rem; color: var(--pb-text); opacity: 0.9;}
    .timer-container, .volume-icon { cursor: pointer; transition: opacity 0.2s; }
    .timer-container:hover, .volume-icon:hover { opacity: 0.7; }
    .tool-icon-btn {
      border: 1px solid rgba(255,255,255,0.24);
      background: transparent;
      color: var(--pb-text);
      border-radius: 999px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: opacity 0.2s, transform 0.2s;
    }
    .tool-icon-btn:hover { opacity: 0.7; transform: scale(1.05); }
    .tool-icon-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .timer-container { display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; }
    .timer-text { font-size: 0.85rem; font-variant-numeric: tabular-nums; font-weight: bold; }
    .volume-container { display: flex; align-items: center; gap: 0.8rem; }
    
    input[type=range] { -webkit-appearance: none; width: 90px; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--pb-text); cursor: pointer; margin-top: -5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.3); border-radius: 2px; }

    .fa-spinner { display: none; }
    .is-buffering .fa-spinner { display: block; animation: spin 1s linear infinite; }
    .is-buffering .fa-play, .is-buffering .fa-pause { display: none !important; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 200;
      opacity: 0; transition: opacity 0.3s;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal {
      background: var(--modal-bg); color: var(--text); padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid var(--border-color);
    }
    .modal h2 { margin-top: 0; font-size: 1.2rem; margin-bottom: 1.5rem; }
    .modal label { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; color: var(--text-muted); }
    .modal input { 
      width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 8px; 
      border: 1px solid var(--border-color); background: var(--bg); color: var(--text); box-sizing: border-box;
    }
    .modal input[type="color"] { padding: 0; height: 40px; cursor: pointer; }
    .modal select {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .modal-option-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      margin: 0 0 1rem;
      color: var(--text);
    }
    .modal-option-row input {
      width: auto;
      margin: 0;
      accent-color: var(--accent);
    }
    .modal-preview {
      margin: 0.25rem 0 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 52px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .modal-preview img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 4px;
      background: transparent;
      padding: 0;
    }
    .preview-logo-plate {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--logo-plate-neutral);
      border: 1px solid var(--logo-plate-border);
    }
    .modal-preview .preview-name {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem; }
    .modal-actions button { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    
    .btn-cancel { background: transparent; color: var(--text); border: 1px solid var(--border-color) !important; }
    .btn-save { background: var(--text); color: var(--bg); }
    .btn-delete { background: #ff3b30; color: white; margin-right: auto; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="app-title">Frequency</div>
    <i class="fa-solid fa-moon theme-toggle" id="theme-icon" onclick="toggleTheme()" tabindex="0" title="Toggle Theme"></i>
  </div>

  <div class="toolbar">
    <input id="station-search" class="search-input" type="search" placeholder="Search stations..." oninput="handleSearchInput(this.value)">
    <button class="toolbar-btn" onclick="playRandomStation()" title="Play random station"><i class="fa-solid fa-shuffle"></i></button>
    <button class="toolbar-btn" id="favorites-filter-btn" onclick="toggleFavoritesOnly()" title="Show only favorites"><i class="fa-solid fa-heart"></i></button>
  </div>

  <div class="recent-wrap" id="recent-wrap"></div>

  <div class="grid" id="grid"></div>

  <div class="player-bar" id="player-bar">
    <div class="now-playing">
      <img id="pb-logo" src="" alt="logo">
      <div>
        <div class="title" id="pb-title">Station Name</div>
        <div class="status" id="pb-status">Ready</div>
      </div>
    </div>
    
    <div class="controls">
      <button class="play-btn" id="play-btn" onclick="togglePlayPause()" tabindex="0">
        <i class="fa-solid fa-play" id="play-icon"></i>
        <i class="fa-solid fa-pause" id="pause-icon" style="display: none;"></i>
        <i class="fa-solid fa-spinner" id="spinner-icon"></i>
      </button>
    </div>
    
    <div class="tools">
      <button class="tool-icon-btn" id="copy-url-btn" onclick="copyCurrentStreamUrl()" title="Copy current stream URL" disabled>
        <i class="fa-solid fa-link"></i>
      </button>
      <div class="timer-container" id="timer-btn" onclick="cycleTimer()" tabindex="0">
        <i class="fa-solid fa-moon"></i>
        <span class="timer-text" id="timer-text"></span>
      </div>
      <div class="volume-container">
        <i class="fa-solid fa-volume-low volume-icon" id="vol-icon" onclick="toggleMute()" tabindex="0"></i>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="updateVolume(this.value)" tabindex="0">
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <h2 id="modal-title">Add Custom Station</h2>
      <label>Station Name</label>
      <input type="text" id="cs-name" placeholder="e.g. My Awesome Radio" oninput="updateModalPreview()">
      
      <label>Stream URL (mp3/aac)</label>
      <input type="url" id="cs-url" placeholder="https://...">
      
      <label>Logo Image URL (optional)</label>
      <input type="url" id="cs-logo" placeholder="https://.../logo.png" oninput="updateModalPreview()">

      <label>Card Display Mode</label>
      <select id="cs-display-mode" onchange="updateModalPreview()">
        <option value="clean">Clean</option>
        <option value="brand" selected>Brand</option>
        <option value="full">Full</option>
      </select>

      <label class="modal-option-row">
        <input type="checkbox" id="cs-auto-color" checked onchange="handleAutoColorToggle()">
        Use automatic background from logo/name
      </label>

      <label>Background Color</label>
      <input type="color" id="cs-bgcolor" value="#475569" oninput="updateModalPreview()">

      <div class="modal-preview" id="cs-preview-card">
        <div class="preview-logo-plate" id="cs-preview-plate">
          <img id="cs-preview-logo" src="" alt="Preview logo" style="display:none;">
          <i class="fa-solid fa-radio" id="cs-preview-icon"></i>
        </div>
        <div class="preview-name" id="cs-preview-name">Custom Station</div>
      </div>

      <div class="modal-actions">
        <button class="btn-delete" id="btn-delete" style="display: none;" onclick="deleteCustomStation()">Delete</button>
        <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
        <button class="btn-save" id="btn-save" onclick="saveCustomStation()">Save</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW setup failed: ', err));
      });
    }

    // --- Theme Logic ---
    function toggleTheme() {
        const html = document.documentElement;
        const icon = document.getElementById('theme-icon');
        if (html.getAttribute('data-theme') === 'dark') {
            html.setAttribute('data-theme', 'light');
            icon.className = 'fa-solid fa-sun theme-toggle';
            localStorage.setItem('freq_theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            icon.className = 'fa-solid fa-moon theme-toggle';
            localStorage.setItem('freq_theme', 'dark');
        }
    }

    const savedTheme = localStorage.getItem('freq_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    window.addEventListener('DOMContentLoaded', () => {
        const icon = document.getElementById('theme-icon');
        if(icon) icon.className = savedTheme === 'light' ? 'fa-solid fa-sun theme-toggle' : 'fa-solid fa-moon theme-toggle';
        const volumeSlider = document.getElementById('volume-slider');
        const savedVolume = parseFloat(localStorage.getItem('freq_volume'));
        const savedMuted = localStorage.getItem('freq_muted') === 'true';
        if (!Number.isNaN(savedVolume)) audio.volume = clamp(savedVolume, 0, 1);
        audio.muted = savedMuted || audio.volume === 0;
        if (volumeSlider) volumeSlider.value = audio.muted ? 0 : audio.volume;
        if (audio.volume > 0) prevVolume = audio.volume;
        updateVolumeIcon();
        updateFavoritesFilterButton();
        updateCopyButtonState();
    });
    // -------------------

    const defaultStations = [
      {id:"stubru",name:"Studio Brussel",streamUrl:"https://icecast.vrtcdn.be/stubru-high.mp3",logo:"stubru.jpg",bgColor:"#ffffff"},
      {id:"npo3fm",name:"NPO 3FM",streamUrl:"https://icecast.omroep.nl/3fm-bb-mp3",logo:"3fm.png",bgColor:"#15171e"},
      {id:"boenkerz",name:"Boenkerz",streamUrl:"https://altair.streamerr.co:8096/boenkerz",logo:"boenkerz.jpg",bgColor:"#ffffff"},
      {id:"tijdloze",name:"De Tijdloze",streamUrl:"https://icecast.vrtcdn.be/stubru_tijdloze-high.mp3",logo:"detijdloze.png",bgColor:"#ffe682"},
      {id:"mnm",name:"MNM",streamUrl:"https://icecast.vrtcdn.be/mnm-high.mp3",logo:"mnm.png",bgColor:"#feff56"},
      {id:"topradio",name:"TOPradio",streamUrl:"https://27783.live.streamtheworld.com/TOP_RADIO.mp3",logo:"top.png",bgColor:"#ffffff"},
      {id:"radio1",name:"Radio 1",streamUrl:"https://icecast.vrtcdn.be/radio1-high.mp3",logo:"radio1.png",bgColor:"#ffffff"},
      {id:"npo1",name:"NPO Radio 1",streamUrl:"https://icecast.omroep.nl/radio1-bb-aac",logo:"npo1.png",bgColor:"#1953ff"},
      {id:"qmusic",name:"Qmusic",streamUrl:"https://icecast-qmusicbe-cdp.triple-it.nl/qmusic.mp3",logo:"qmusic.png",bgColor:"#ffffff"},
      {id:"joe",name:"JOE",streamUrl:"https://streams.radio.dpgmedia.cloud/redirect/joe_fm/mp3",logo:"joe.png",bgColor:"#1a52b3"},
      {id:"willy",name:"Willy",streamUrl:"https://icecast-qmusicbe-cdp.triple-it.nl/willy.mp3",logo:"willy.png",bgColor:"#000000"},
      {id:"willyclassx",name:"Willy Class X",streamUrl:"https://streams.radio.dpgmedia.cloud/redirect/willy_be_class_x/mp3",logo:"willyclassx.png"},
      {id:"radio2",name:"Radio 2",streamUrl:"https://icecast.vrtcdn.be/ra2wvl-high.mp3",logo:"radio2.png"},
      {id:"klara",name:"Klara",streamUrl:"https://icecast.vrtcdn.be/klara-high.mp3",logo:"klara.png"},
      {id:"nostalgie",name:"Nostalgie",streamUrl:"https://playerservices.streamtheworld.com/api/livestream-redirect/NOSTALGIEWHATAFEELING.mp3",logo:"nostalgie.png"}
    ];

    const audio = new Audio();
    let activeStation = null;
    let prevVolume = parseFloat(localStorage.getItem('freq_volume_prev')) || 1;
    let favorites = JSON.parse(localStorage.getItem('freq_favorites')) || [];
    let customStations = JSON.parse(localStorage.getItem('freq_custom_stations')) || [];
    let recentStations = JSON.parse(localStorage.getItem('freq_recent_stations')) || [];
    let stationColorCache = JSON.parse(localStorage.getItem('freq_station_colors')) || {};
    let stationAccentCache = JSON.parse(localStorage.getItem('freq_station_accents')) || {};
    let stationDisplayModes = JSON.parse(localStorage.getItem('freq_station_display_modes')) || {};
    let showFavoritesOnly = localStorage.getItem('freq_show_favorites_only') === 'true';
    let currentSearchTerm = '';
    let editingStationId = null; // Tracks if we are editing an existing station
    const defaultCustomColor = '#475569';

    const timerCycles = [0, 15, 30, 60]; 
    const recentLimit = 5;
    let currentTimerCycleIndex = 0;
    let sleepTimeRemaining = 0;
    let timerInterval = null;

    function getAllStations() {
      return [...defaultStations, ...customStations];
    }

    function getContrastColor(hexColor) {
      if (!hexColor) return '#ffffff';
      let hex = hexColor.replace('#', '');
      let r = parseInt(hex.substr(0, 2), 16);
      let g = parseInt(hex.substr(2, 2), 16);
      let b = parseInt(hex.substr(4, 2), 16);
      let yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
      return (yiq >= 128) ? '#000000' : '#ffffff';
    }

    function hexToRgba(hex, alpha) {
      let h = hex.replace('#', '');
      if(h.length === 3) h = h.split('').map(c => c+c).join('');
      let r = parseInt(h.substring(0,2), 16);
      let g = parseInt(h.substring(2,4), 16);
      let b = parseInt(h.substring(4,6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    audio.addEventListener('waiting', () => {
        updatePlayerUI('buffering');
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
    });
    audio.addEventListener('playing', () => {
        updatePlayerUI('playing');
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    });
    audio.addEventListener('pause', () => {
        updatePlayerUI('paused');
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    });

    function getSortedStations() {
      return getAllStations().sort((a, b) => {
        const aFav = favorites.includes(a.id) ? 1 : 0;
        const bFav = favorites.includes(b.id) ? 1 : 0;
        return bFav - aFav; 
      });
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function rgbToHex(r, g, b) {
      const toHex = (value) => clamp(Math.round(value), 0, 255).toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function hexToRgb(hex) {
      if (!hex || typeof hex !== 'string') return null;
      let h = hex.trim().replace('#', '');
      if (h.length === 3) h = h.split('').map(char => char + char).join('');
      if (!/^[0-9a-f]{6}$/i.test(h)) return null;
      return {
        r: parseInt(h.substring(0, 2), 16),
        g: parseInt(h.substring(2, 4), 16),
        b: parseInt(h.substring(4, 6), 16)
      };
    }

    function rgbToHsl(r, g, b) {
      const rn = r / 255;
      const gn = g / 255;
      const bn = b / 255;
      const max = Math.max(rn, gn, bn);
      const min = Math.min(rn, gn, bn);
      const d = max - min;
      let h = 0;
      let s = 0;
      const l = (max + min) / 2;

      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        if (max === rn) h = ((gn - bn) / d) % 6;
        else if (max === gn) h = (bn - rn) / d + 2;
        else h = (rn - gn) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }

      return { h, s: s * 100, l: l * 100 };
    }

    function hslToRgb(h, s, l) {
      const sat = clamp(s, 0, 100) / 100;
      const light = clamp(l, 0, 100) / 100;
      const c = (1 - Math.abs(2 * light - 1)) * sat;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = light - c / 2;
      let r = 0, g = 0, b = 0;

      if (h < 60) [r, g, b] = [c, x, 0];
      else if (h < 120) [r, g, b] = [x, c, 0];
      else if (h < 180) [r, g, b] = [0, c, x];
      else if (h < 240) [r, g, b] = [0, x, c];
      else if (h < 300) [r, g, b] = [x, 0, c];
      else [r, g, b] = [c, 0, x];

      return {
        r: Math.round((r + m) * 255),
        g: Math.round((g + m) * 255),
        b: Math.round((b + m) * 255)
      };
    }

    function hslToHex(h, s, l) {
      const rgb = hslToRgb(h, s, l);
      return rgbToHex(rgb.r, rgb.g, rgb.b);
    }

    function clampAccentColor(hexColor) {
      const rgb = hexToRgb(hexColor);
      if (!rgb) return null;
      const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
      return hslToHex(hsl.h, clamp(hsl.s, 45, 78), clamp(hsl.l, 34, 62));
    }

    function hashToColor(name) {
      const source = name || 'station';
      let hash = 0;
      for (let i = 0; i < source.length; i++) hash = source.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash % 360);
      return hslToHex(hue, 62, 46);
    }

    function getStationById(id) {
      return getAllStations().find(station => station.id === id);
    }

    function getStationDisplayMode(stationId) {
      const mode = stationDisplayModes[stationId];
      return ['clean', 'brand', 'full'].includes(mode) ? mode : 'brand';
    }

    function getStationAccentColor(station) {
      const manualColor = stationColorCache[station.id];
      if (isHexColor(manualColor)) return manualColor;

      const inferredColor = stationAccentCache[station.id];
      if (isHexColor(inferredColor)) return inferredColor;

      const defaultColor = clampAccentColor(station.bgColor);
      if (defaultColor) return defaultColor;

      return hashToColor(station.name);
    }

    function getStationBgColor(station) {
      return getStationAccentColor(station);
    }

    function isHexColor(value) {
      return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);
    }

    function safePreviewTextColor(backgroundColor) {
      return isHexColor(backgroundColor) ? getContrastColor(backgroundColor) : '#ffffff';
    }

    function applyPlayerTheme(station) {
      const stationColor = getStationAccentColor(station);
      const textColor = getContrastColor(stationColor);
      const glassBg = hexToRgba(stationColor || '#181818', 0.95);
      document.documentElement.style.setProperty('--pb-bg', glassBg);
      document.documentElement.style.setProperty('--pb-text', textColor);
    }

    function applyCardTheme(card, station) {
      const accentColor = getStationAccentColor(station);
      const mode = getStationDisplayMode(station.id);
      const textOnAccent = getContrastColor(accentColor);

      const cardBg = mode === 'full' ? accentColor : 'var(--card-surface)';
      const cardText = mode === 'full' ? textOnAccent : 'var(--text)';
      const logoPlateBg = mode === 'clean'
        ? 'var(--logo-plate-neutral)'
        : mode === 'brand'
          ? hexToRgba(accentColor, 0.18)
          : hexToRgba(textOnAccent === '#ffffff' ? '#ffffff' : '#000000', 0.16);
      const logoPlateBorder = mode === 'clean'
        ? 'var(--logo-plate-border)'
        : hexToRgba(accentColor, 0.45);

      card.classList.remove('mode-clean', 'mode-brand', 'mode-full');
      card.classList.add(`mode-${mode}`);
      card.style.backgroundColor = cardBg;
      card.style.color = cardText;
      card.style.setProperty('--card-logo-plate-bg', logoPlateBg);
      card.style.setProperty('--card-logo-plate-border', logoPlateBorder);
      return { accentColor };
    }

    function updateStationCardColor(stationId, color) {
      stationColorCache[stationId] = clampAccentColor(color) || color;
      localStorage.setItem('freq_station_colors', JSON.stringify(stationColorCache));
      const station = getStationById(stationId);
      if (!station) return;
      const card = document.getElementById(`card-${stationId}`);
      if (card) {
        applyCardTheme(card, station);
      }
      if (activeStation && activeStation.id === stationId) {
        applyPlayerTheme(station);
        updateGridStyles(stationId);
      }
    }

    function updateStationAccentColor(stationId, color) {
      const accentColor = clampAccentColor(color) || hashToColor(getStationById(stationId)?.name);
      stationAccentCache[stationId] = accentColor;
      localStorage.setItem('freq_station_accents', JSON.stringify(stationAccentCache));
      const station = getStationById(stationId);
      if (!station) return;
      const card = document.getElementById(`card-${stationId}`);
      if (card && !stationColorCache[stationId]) applyCardTheme(card, station);
      if (activeStation && activeStation.id === stationId && !stationColorCache[stationId]) {
        applyPlayerTheme(station);
        updateGridStyles(stationId);
      }
    }

    function inferColorFromLogo(station) {
      if (!station.logo || stationColorCache[station.id] || stationAccentCache[station.id]) return;
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.referrerPolicy = 'no-referrer';
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          const sampleSize = 32;
          canvas.width = sampleSize;
          canvas.height = sampleSize;
          ctx.drawImage(img, 0, 0, sampleSize, sampleSize);
          const data = ctx.getImageData(0, 0, sampleSize, sampleSize).data;
          let weightedHueX = 0;
          let weightedHueY = 0;
          let weightedS = 0;
          let weightedL = 0;
          let totalWeight = 0;
          for (let i = 0; i < data.length; i += 4) {
            const alpha = data[i + 3];
            if (alpha < 160) continue;
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            if (max > 240 && min > 230) continue;
            if (max < 28 && min < 20) continue;
            const hsl = rgbToHsl(r, g, b);
            if (hsl.s < 12) continue;
            const weight = (hsl.s / 100) * (alpha / 255);
            const hueRadians = hsl.h * Math.PI / 180;
            weightedHueX += Math.cos(hueRadians) * weight;
            weightedHueY += Math.sin(hueRadians) * weight;
            weightedS += hsl.s * weight;
            weightedL += hsl.l * weight;
            totalWeight += weight;
          }
          if (totalWeight <= 0) {
            updateStationAccentColor(station.id, hashToColor(station.name));
            return;
          }
          const hue = (Math.atan2(weightedHueY, weightedHueX) * 180 / Math.PI + 360) % 360;
          const sat = clamp(weightedS / totalWeight, 45, 78);
          const light = clamp(weightedL / totalWeight, 34, 62);
          const color = hslToHex(hue, sat, light);
          updateStationAccentColor(station.id, color);
        } catch (err) {
          updateStationAccentColor(station.id, hashToColor(station.name));
        }
      };
      img.onerror = () => updateStationAccentColor(station.id, hashToColor(station.name));
      img.src = station.logo;
    }

    function addRecentStation(stationId) {
      recentStations = recentStations.filter(id => id !== stationId);
      recentStations.unshift(stationId);
      recentStations = recentStations.slice(0, recentLimit);
      localStorage.setItem('freq_recent_stations', JSON.stringify(recentStations));
      renderRecentStations();
    }

    function renderRecentStations() {
      const wrap = document.getElementById('recent-wrap');
      wrap.innerHTML = '';
      const validRecent = recentStations
        .map(id => getStationById(id))
        .filter(Boolean);
      if (!validRecent.length) {
        wrap.classList.remove('active');
        return;
      }
      wrap.classList.add('active');
      validRecent.forEach(station => {
        const chip = document.createElement('button');
        chip.className = 'recent-chip';
        chip.title = `Play ${station.name}`;
        chip.innerText = station.name;
        chip.onclick = () => selectStation(station);
        wrap.appendChild(chip);
      });
    }

    function updateFavoritesFilterButton() {
      const btn = document.getElementById('favorites-filter-btn');
      if (!btn) return;
      btn.classList.toggle('active', showFavoritesOnly);
      btn.title = showFavoritesOnly ? 'Showing only favorites' : 'Show only favorites';
    }

    function toggleFavoritesOnly() {
      showFavoritesOnly = !showFavoritesOnly;
      localStorage.setItem('freq_show_favorites_only', String(showFavoritesOnly));
      updateFavoritesFilterButton();
      initGrid();
    }

    function getModeLabel(mode) {
      if (mode === 'clean') return 'Clean';
      if (mode === 'full') return 'Full';
      return 'Brand';
    }

    function cycleDisplayMode(e, stationId) {
      e.stopPropagation();
      const modes = ['clean', 'brand', 'full'];
      const currentIndex = modes.indexOf(getStationDisplayMode(stationId));
      const nextMode = modes[(currentIndex + 1) % modes.length];
      stationDisplayModes[stationId] = nextMode;
      localStorage.setItem('freq_station_display_modes', JSON.stringify(stationDisplayModes));
      initGrid();
      if (activeStation && activeStation.id) updateGridStyles(activeStation.id);
    }

    function handleSearchInput(value) {
      currentSearchTerm = value.trim().toLowerCase();
      initGrid();
    }

    function playRandomStation() {
      const stations = getAllStations();
      if (!stations.length) return;
      const pool = activeStation ? stations.filter(st => st.id !== activeStation.id) : stations;
      const selected = pool[Math.floor(Math.random() * pool.length)];
      selectStation(selected || stations[0]);
    }

    function initGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const sortedStations = getSortedStations().filter(station =>
        (!currentSearchTerm || station.name.toLowerCase().includes(currentSearchTerm)) &&
        (!showFavoritesOnly || favorites.includes(station.id))
      );

      sortedStations.forEach((station, index) => {
        const mode = getStationDisplayMode(station.id);
        const modeLabel = getModeLabel(mode);
        const isFav = favorites.includes(station.id);
        const isCustom = station.id.startsWith('custom_');
        
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${station.id}`;
        card.tabIndex = 0; 
        
        card.style.animationDelay = `${index * 0.05}s`;
        const { accentColor } = applyCardTheme(card, station);

        if (activeStation && activeStation.id === station.id) {
          card.classList.add('playing');
          const glowColor = accentColor === '#000000' ? '#555555' : accentColor;
          card.style.boxShadow = `0 0 0 4px var(--bg), 0 0 0 8px ${glowColor}, 0 15px 30px rgba(0,0,0,0.5)`;
        }

        card.onclick = () => selectStation(station);
        card.onkeydown = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); selectStation(station); }
        };

        const heartClass = isFav ? 'fa-solid active' : 'fa-regular';
        
        // Show edit button only for custom stations
        const editHtml = isCustom ? `<i class="fa-solid fa-pen edit-btn" onclick="openEditModal(event, '${station.id}')" tabindex="0"></i>` : '';
        const modeHtml = `<button class="mode-btn" onclick="cycleDisplayMode(event, '${station.id}')" title="Display: ${modeLabel} (click to cycle)" tabindex="0"><i class="fa-solid fa-layer-group"></i></button>`;

        const logoHTML = station.logo 
            ? `<div class="logo-plate">
                 <img src="${station.logo}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                 <i class="fa-solid fa-radio" style="display:none; font-size: 1.5rem; opacity: 0.5;"></i>
               </div>`
            : `<div class="logo-plate"><i class="fa-solid fa-radio" style="font-size: 1.5rem; opacity: 0.5;"></i></div>`;

        card.innerHTML = `
          ${editHtml}
          ${modeHtml}
          <i class="${heartClass} fa-heart favorite-btn" 
             onclick="toggleFavorite(event, '${station.id}')" tabindex="0"></i>
          ${logoHTML}
          <div class="name">${station.name}</div>
        `;
        grid.appendChild(card);
        inferColorFromLogo(station);
      });

      // Append "Add Custom Station" Button
      const addBtn = document.createElement('div');
      addBtn.className = 'card add-btn';
      addBtn.tabIndex = 0;
      addBtn.onclick = openAddModal;
      addBtn.onkeydown = (e) => { if (e.key === 'Enter') openAddModal(); };
      addBtn.innerHTML = `
        <i class="fa-solid fa-plus"></i>
        <div class="name">Add Custom</div>
      `;
      grid.appendChild(addBtn);
      renderRecentStations();
    }

    function toggleFavorite(e, id) {
        e.stopPropagation(); 
        if (favorites.includes(id)) favorites = favorites.filter(favId => favId !== id);
        else favorites.push(id);
        
        localStorage.setItem('freq_favorites', JSON.stringify(favorites));
        initGrid(); 
    }

    function updateGridStyles(activeStationId) {
      const sortedStations = getSortedStations();
      sortedStations.forEach(station => {
        const card = document.getElementById(`card-${station.id}`);
        if (!card) return;
        const { accentColor } = applyCardTheme(card, station);

        if (station.id === activeStationId) {
          card.classList.add('playing');
          const glowColor = accentColor === '#000000' ? '#555555' : accentColor;
          card.style.boxShadow = `0 0 0 4px var(--bg), 0 0 0 8px ${glowColor}, 0 15px 30px rgba(0,0,0,0.5)`;
        } else {
          card.classList.remove('playing');
          card.style.boxShadow = 'none';
        }
      });
    }

    function selectStation(station) {
      if (activeStation && activeStation.id === station.id) {
        togglePlayPause();
      } else {
        activeStation = station;
        audio.src = station.streamUrl;
        audio.play();
        addRecentStation(station.id);
        
        document.title = `${station.name} | Frequency`;
        
        document.getElementById('player-bar').classList.add('active');
        document.getElementById('pb-title').innerText = station.name;
        
        const logoImg = document.getElementById('pb-logo');
        if(station.logo) {
            logoImg.style.display = 'block';
            logoImg.src = station.logo;
        } else {
            logoImg.style.display = 'none';
        }

        applyPlayerTheme(station);

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: station.name,
            artist: 'Frequency Radio',
            artwork: station.logo ? [{ src: station.logo, sizes: '512x512', type: 'image/png' }] : []
          });
          navigator.mediaSession.setActionHandler('play', () => audio.play());
          navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        }
      }
      updateCopyButtonState();
      updateGridStyles(station.id);
    }

    function togglePlayPause() {
      if (!activeStation) return;
      if (audio.paused) audio.play();
      else audio.pause();
    }

    window.addEventListener('keydown', (e) => {
      if(e.code === 'Space' && activeStation && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'BUTTON') {
        e.preventDefault();
        togglePlayPause();
      }
    });

    function updateVolume(val) {
      const volumeValue = Number(val);
      audio.volume = volumeValue;
      if (volumeValue > 0) audio.muted = false;
      if (volumeValue > 0) prevVolume = volumeValue;
      localStorage.setItem('freq_volume', String(audio.volume));
      localStorage.setItem('freq_muted', String(audio.muted));
      localStorage.setItem('freq_volume_prev', String(prevVolume));
      updateVolumeIcon();
    }

    function toggleMute() {
      const slider = document.getElementById('volume-slider');
      if (audio.muted || audio.volume === 0) {
        audio.muted = false;
        slider.value = prevVolume > 0 ? prevVolume : 1;
        audio.volume = slider.value;
      } else {
        prevVolume = audio.volume;
        audio.muted = true;
        slider.value = 0;
      }
      localStorage.setItem('freq_volume', String(audio.volume));
      localStorage.setItem('freq_muted', String(audio.muted));
      localStorage.setItem('freq_volume_prev', String(prevVolume));
      updateVolumeIcon();
    }

    function updateVolumeIcon() {
      const icon = document.getElementById('vol-icon');
      if (audio.muted || audio.volume === 0) icon.className = 'fa-solid fa-volume-xmark volume-icon';
      else if (audio.volume < 0.5) icon.className = 'fa-solid fa-volume-low volume-icon';
      else icon.className = 'fa-solid fa-volume-high volume-icon';
    }

    function updateCopyButtonState() {
      const copyBtn = document.getElementById('copy-url-btn');
      if (!copyBtn) return;
      const hasStation = Boolean(activeStation && activeStation.streamUrl);
      copyBtn.disabled = !hasStation;
      copyBtn.title = hasStation ? `Copy stream URL for ${activeStation.name}` : 'Select a station to copy stream URL';
    }

    async function copyCurrentStreamUrl() {
      if (!activeStation || !activeStation.streamUrl) return;
      try {
        await navigator.clipboard.writeText(activeStation.streamUrl);
        const status = document.getElementById('pb-status');
        const previous = status.innerText;
        status.innerText = 'Stream URL copied';
        setTimeout(() => {
          if (status.innerText === 'Stream URL copied') status.innerText = previous;
        }, 1300);
      } catch (err) {
        alert('Could not copy stream URL.');
      }
    }

    function cycleTimer() {
      currentTimerCycleIndex = (currentTimerCycleIndex + 1) % timerCycles.length;
      const minutes = timerCycles[currentTimerCycleIndex];
      clearInterval(timerInterval);
      const timerText = document.getElementById('timer-text');

      if (minutes === 0) timerText.innerText = '';
      else {
        sleepTimeRemaining = minutes * 60;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          sleepTimeRemaining--;
          updateTimerDisplay();
          if (sleepTimeRemaining <= 0) {
            clearInterval(timerInterval);
            audio.pause();
            currentTimerCycleIndex = 0;
            timerText.innerText = '';
          }
        }, 1000);
      }
    }

    function updateTimerDisplay() {
      const m = Math.floor(sleepTimeRemaining / 60);
      const s = sleepTimeRemaining % 60;
      document.getElementById('timer-text').innerText = `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updatePlayerUI(state) {
      const btn = document.getElementById('play-btn');
      const status = document.getElementById('pb-status');
      
      btn.classList.remove('is-buffering');
      document.getElementById('play-icon').style.display = 'none';
      document.getElementById('pause-icon').style.display = 'none';

      if (state === 'buffering') {
        btn.classList.add('is-buffering');
        status.innerText = "Buffering...";
      } else if (state === 'playing') {
        document.getElementById('pause-icon').style.display = 'block';
        status.innerText = "Live Broadcast";
      } else if (state === 'paused') {
        document.getElementById('play-icon').style.display = 'block';
        status.innerText = "Paused";
      }
    }

    // --- Modal Logic (Add/Edit/Remove Custom Stations) ---
    
    function openAddModal() { 
        editingStationId = null;
        document.getElementById('modal-title').innerText = "Add Custom Station";
        document.getElementById('btn-save').innerText = "Save";
        document.getElementById('btn-delete').style.display = 'none';
        
        document.getElementById('cs-name').value = '';
        document.getElementById('cs-url').value = '';
        document.getElementById('cs-logo').value = '';
        document.getElementById('cs-auto-color').checked = true;
        document.getElementById('cs-bgcolor').value = defaultCustomColor;
        document.getElementById('cs-display-mode').value = 'brand';

        handleAutoColorToggle();
        updateModalPreview();
        document.getElementById('add-modal').classList.add('active'); 
    }

    function openEditModal(e, id) {
        e.stopPropagation(); // Prevents station from playing when clicking the pencil
        
        const station = customStations.find(s => s.id === id);
        if (!station) return;

        editingStationId = id;
        document.getElementById('modal-title').innerText = "Edit Station";
        document.getElementById('btn-save').innerText = "Update";
        document.getElementById('btn-delete').style.display = 'block';

        document.getElementById('cs-name').value = station.name;
        document.getElementById('cs-url').value = station.streamUrl;
        document.getElementById('cs-logo').value = station.logo || '';
        const cachedColor = stationColorCache[id];
        document.getElementById('cs-auto-color').checked = !cachedColor;
        document.getElementById('cs-bgcolor').value = isHexColor(cachedColor) ? cachedColor : defaultCustomColor;
        document.getElementById('cs-display-mode').value = getStationDisplayMode(id);

        handleAutoColorToggle();
        updateModalPreview();
        document.getElementById('add-modal').classList.add('active'); 
    }

    function closeAddModal() { 
        document.getElementById('add-modal').classList.remove('active'); 
    }

    function handleAutoColorToggle() {
        const isAuto = document.getElementById('cs-auto-color').checked;
        const colorPicker = document.getElementById('cs-bgcolor');
        colorPicker.disabled = isAuto;
        colorPicker.style.opacity = isAuto ? '0.5' : '1';
        updateModalPreview();
    }

    function updateModalPreview() {
        const name = document.getElementById('cs-name').value.trim() || 'Custom Station';
        const logo = document.getElementById('cs-logo').value.trim();
        const isAuto = document.getElementById('cs-auto-color').checked;
        const manualColor = document.getElementById('cs-bgcolor').value || defaultCustomColor;
        const previewMode = document.getElementById('cs-display-mode').value;
        const accentColor = isAuto ? hashToColor(name) : (clampAccentColor(manualColor) || manualColor);
        const previewColor = previewMode === 'full' ? accentColor : 'var(--card-surface)';
        const previewTextColor = previewMode === 'full' ? safePreviewTextColor(accentColor) : 'var(--text)';
        const previewPlateBg = previewMode === 'clean'
          ? 'var(--logo-plate-neutral)'
          : previewMode === 'brand'
            ? hexToRgba(accentColor, 0.18)
            : hexToRgba(previewTextColor === '#ffffff' ? '#ffffff' : '#000000', 0.16);
        const previewPlateBorder = previewMode === 'clean'
          ? 'var(--logo-plate-border)'
          : hexToRgba(accentColor, 0.45);

        const previewCard = document.getElementById('cs-preview-card');
        const previewName = document.getElementById('cs-preview-name');
        const previewLogo = document.getElementById('cs-preview-logo');
        const previewIcon = document.getElementById('cs-preview-icon');
        const previewPlate = document.getElementById('cs-preview-plate');

        previewCard.style.backgroundColor = previewColor;
        previewCard.style.color = previewTextColor;
        previewPlate.style.backgroundColor = previewPlateBg;
        previewPlate.style.borderColor = previewPlateBorder;
        previewName.innerText = name;

        if (logo) {
            previewLogo.src = logo;
            previewLogo.style.display = 'block';
            previewIcon.style.display = 'none';
        } else {
            previewLogo.style.display = 'none';
            previewIcon.style.display = 'block';
        }
    }
    
    function saveCustomStation() {
        const name = document.getElementById('cs-name').value.trim();
        const url = document.getElementById('cs-url').value.trim();
        const logo = document.getElementById('cs-logo').value.trim();
        const useAutoColor = document.getElementById('cs-auto-color').checked;
        const chosenColor = document.getElementById('cs-bgcolor').value || defaultCustomColor;
        const displayMode = document.getElementById('cs-display-mode').value;

        if(!name || !url) return alert('Station Name and Stream URL are required!');

        if (editingStationId) {
            // Update existing
            const index = customStations.findIndex(s => s.id === editingStationId);
            if (index > -1) {
                customStations[index].name = name;
                customStations[index].streamUrl = url;
                customStations[index].logo = logo || null;
                if (useAutoColor) {
                  delete stationColorCache[editingStationId];
                  delete stationAccentCache[editingStationId];
                }
                else stationColorCache[editingStationId] = chosenColor;
                stationDisplayModes[editingStationId] = displayMode;
                
                // Live update player if we are currently listening to it
                if (activeStation && activeStation.id === editingStationId) {
                    selectStation(customStations[index]); 
                }
            }
        } else {
            // Create new
            const newStation = {
                id: 'custom_' + Date.now(),
                name: name,
                streamUrl: url,
                logo: logo || null
            };
            customStations.push(newStation);
            if (useAutoColor) {
              delete stationColorCache[newStation.id];
              delete stationAccentCache[newStation.id];
            }
            else stationColorCache[newStation.id] = chosenColor;
            stationDisplayModes[newStation.id] = displayMode;
        }

        localStorage.setItem('freq_custom_stations', JSON.stringify(customStations));
        localStorage.setItem('freq_station_colors', JSON.stringify(stationColorCache));
        localStorage.setItem('freq_station_accents', JSON.stringify(stationAccentCache));
        localStorage.setItem('freq_station_display_modes', JSON.stringify(stationDisplayModes));
        closeAddModal();
        initGrid(); 
    }

    function deleteCustomStation() {
        if (!editingStationId) return;
        
        if (confirm("Are you sure you want to delete this custom station?")) {
            customStations = customStations.filter(s => s.id !== editingStationId);
            localStorage.setItem('freq_custom_stations', JSON.stringify(customStations));
            delete stationColorCache[editingStationId];
            delete stationAccentCache[editingStationId];
            delete stationDisplayModes[editingStationId];
            localStorage.setItem('freq_station_colors', JSON.stringify(stationColorCache));
            localStorage.setItem('freq_station_accents', JSON.stringify(stationAccentCache));
            localStorage.setItem('freq_station_display_modes', JSON.stringify(stationDisplayModes));
            
            // Clean up favorites
            favorites = favorites.filter(id => id !== editingStationId);
            localStorage.setItem('freq_favorites', JSON.stringify(favorites));
            recentStations = recentStations.filter(id => id !== editingStationId);
            localStorage.setItem('freq_recent_stations', JSON.stringify(recentStations));

            // If we are currently playing the deleted station, stop it
            if (activeStation && activeStation.id === editingStationId) {
                audio.pause();
                document.getElementById('player-bar').classList.remove('active');
                activeStation = null;
                updateCopyButtonState();
            }

            closeAddModal();
            initGrid();
        }
    }

    document.getElementById('add-modal').addEventListener('click', (e) => {
      if (e.target.id === 'add-modal') closeAddModal();
    });

    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('add-modal');
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        closeAddModal();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        saveCustomStation();
      }
    });

    initGrid();
  </script>
</body>
